services:

# --- Core Services ---

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: docker-local-dev-secret
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: django
      DB_USER: local_user
      DB_PASSWORD: local_password
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_user -d django"]
      interval: 1s
      timeout: 5s
      retries: 5

# --- Dev Services (Use --profile dev-extras to enable these) ---

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - "dev-extras"
      - "pgadmin"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
