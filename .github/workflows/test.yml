name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install django whitenoise gunicorn python-dotenv jinja2 markupsafe \
            govuk-frontend-jinja pytest pytest-django django-browser-reload

      - name: Setup govuk-frontend
        run: python scripts/setup_govuk_frontend.py

      - name: Run tests
        run: pytest tests/ -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "false"