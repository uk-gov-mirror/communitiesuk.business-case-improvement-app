name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.3"
          poetry install --no-interaction

      - name: Start Local Database
        run: |
          docker compose up -d db

      - name: Setup govuk-frontend
        run: poetry run python scripts/setup_govuk_frontend.py

      - name: Run tests
        run: poetry run pytest tests/ -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "false"
          ENTRA_ID_ENABLED: "true"
          ENTRA_ALLOWED_TENANTS: "00000000-0000-0000-0000-000000000000"
