name: Deploy to Production
run-name: Deploy ${{ github.ref_name }} to Production

on:
  release:
    types: [released]   # full releases
  workflow_dispatch:     # for redeploys/rollbacks: choose a TAG in "Use workflow from"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Deployment has a Release Tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Production can only be deployed from a tag. Select a tag by using 'Use workflow from'."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.ref_name }}

  deploy:
    needs: test
    uses: ./.github/workflows/_deploy.yml   # AWS-Prod needs approval from registered approver
    with:
      environment: aws-prod
      ref: ${{ github.ref_name }}
    secrets: inherit
    